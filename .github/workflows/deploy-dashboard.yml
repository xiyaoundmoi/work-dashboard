name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: [Noemi_Dashboard.html, .github/workflows/deploy-dashboard.yml]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_PUBLISHING_READ_TOKEN }}
        run: |
          mkdir -p _site
          cp Noemi_Dashboard.html _site/index.html
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_PUBLISHING_READ_TOKEN is not configured; publishing the safe placeholder."
            exit 0
          fi
          for source in \
            a20e0d46-3608-490a-8636-9cc8d4a68aae:current \
            9c7b84ff-0454-4c6c-8c7c-396e3859c316:historical \
            b488f985-5854-4924-8bc0-007d0442d693:projects \
            6c866113-529c-4257-b8d8-8be54ede12e5:workstreams; do
            id="${source%%:*}"; file="${source##*:}.json"
            curl --fail-with-body --silent --show-error -X POST "https://api.notion.com/v1/data_sources/$id/query" -H "Authorization: Bearer $NOTION_TOKEN" -H 'Notion-Version: 2026-03-11' -H 'Content-Type: application/json' --data '{"page_size":100}' > "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const get = name => JSON.parse(fs.readFileSync(name + '.json', 'utf8')).results || [];
          const [current, historical, projects, workstreams] = ['current','historical','projects','workstreams'].map(get);
          const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const title = p => (p?.title || []).map(x => x.plain_text || '').join('');
          const text = p => (p?.rich_text || []).map(x => x.plain_text || '').join('');
          const select = p => p?.select?.name || '';
          const num = p => p?.number ?? null;
          const date = p => p?.date?.start || '';
          const alias = n => ({AO:'Arabian Oud', DDR:'DDR Museum'}[n] || n);
          const now = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});
          const year=+now.year, month=+now.month, day=+now.day, weekday=({Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7})[now.weekday];
          const todayMonth=`${now.year}-${now.month}-01`, daysInMonth=new Date(Date.UTC(year,month,0)).getUTCDate();
          const monday=new Date(Date.UTC(year,month-1,day-Math.min(weekday,7)+1)).toISOString().slice(0,10);
          const statusClass=s=>({Ahead:'ahead','On Track':'track',Attention:'attention',Behind:'behind',Complete:'complete',Priority:'priority','In Progress':'progress',Waiting:'waiting',Upcoming:'waiting',Closed:'closed'})[s]||'routine';
          const tag=s=>`<span class="tag ${statusClass(s)}">${esc(s || '—')}</span>`;
          const progress = row => { const p=row.properties||{}, period=select(p['Posting Period']), label=date(p['Period Label']), target=num(p.Target), published=num(p.Published); const active=select(p['Active / Inactive'])==='Active', isCurrent=period==='Monthly'?label===todayMonth:period==='Weekly'&&label===monday; const expected=target==null?null:period==='Weekly'?Math.min(target,target*Math.min(weekday,5)/5):Math.min(target,target*day/daysInMonth); let status='Awaiting Data'; if(published!=null&&target!=null){ if(published>=target)status='Complete'; else if(published>=expected*1.1)status='Ahead'; else if(published>=expected*.9)status='On Track'; else if(published>=expected*.8)status='Attention'; else status='Behind'; } return {client:alias(title(p.Client)),platform:select(p.Platform),period,label,target,published,expected,status,owner:select(p.Owner)||'—',active,isCurrent}; };
          const live=current.map(progress).filter(r=>r.active&&r.isCurrent);
          const reported=live.filter(r=>r.published!=null&&r.target!=null), totalTarget=live.reduce((n,r)=>n+(r.target||0),0), totalPublished=reported.reduce((n,r)=>n+r.published,0), allReported=live.length>0&&live.length===reported.length, overall=allReported&&totalTarget?totalPublished/totalTarget:null;
          const urgency={Behind:0,Attention:1,'On Track':2,Ahead:3,Complete:4,'Awaiting Data':5};
          const counts=Object.fromEntries(['On Track','Attention','Behind','Ahead'].map(s=>[s,reported.filter(r=>r.status===s).length]));
          const metric=(name,value,detail)=>`<div class="metric-card"><div class="metric-label">${name}</div><div class="metric-value">${value}</div><div class="metric-detail">${detail}</div></div>`;
          const projectRows=projects.map(row=>{const p=row.properties||{};return {id:row.id,project:title(p.Project),client:alias(title(p.Client)),status:select(p.Status),phase:select(p.Phase),priority:select(p.Priority),owner:select(p.Owner)||'—',focus:text(p['Current Focus']),next:text(p['Next Step']),waiting:text(p['Waiting For']),attention:p['Needs Attention']?.checkbox===true};});
          const clientOf=id=>projectRows.find(p=>p.id===id)?.project||'Unlinked client';
          const streamRows=workstreams.map(row=>{const p=row.properties||{};return {client:clientOf((p.Client?.relation||[])[0]?.id),workstream:title(p.Workstream),owner:select(p.Owner)||'Unassigned',status:select(p.Status),reviewer:select(p.Reviewer),needsReview:p['Needs Review']?.checkbox===true,due:date(p['Due Date'])};});
          const activeProjects=projectRows.filter(p=>!['Closed','Waiting','Upcoming'].includes(p.status)&&!['Closed','Waiting Brief','Waiting / Blocked'].includes(p.phase));
          const waiting=projectRows.filter(p=>p.waiting||['Waiting','Blocked','Upcoming'].includes(p.status)||['Waiting Brief','Waiting / Blocked'].includes(p.phase));
          const priority=projectRows.filter(p=>p.status==='Priority'||p.priority==='High'||p.attention||['Waiting Brief','Waiting / Blocked'].includes(p.phase));
          const clientPosting=name=>{const rows=live.filter(r=>r.client===alias(name));if(!rows.length)return 'No current KPI';return rows.some(r=>r.status==='Awaiting Data')?'Awaiting Data':[...rows].sort((a,b)=>urgency[a.status]-urgency[b.status])[0].status};
          const ownerName=o=>o==='Mixed'?'Noemi + Intern':o;
          const attentionProjects=projectRows.filter(p=>p.attention||p.status==='Priority'||p.priority==='High');
          const executive=`<section><h2>Management Overview</h2><div class="kpi-grid executive-grid">${metric('Active Projects',activeProjects.length,'Current delivery accounts')}${metric('Attention Needed',attentionProjects.length,attentionProjects.length?'Projects requiring direct attention':'No project flags recorded')}${metric('Waiting / Blocked',waiting.length,waiting.length?'Dependencies requiring follow-up':'No active dependencies')}${metric('Publishing On Track',reported.length?`${counts['On Track'] + counts.Ahead + reported.filter(r=>r.status==='Complete').length} platforms`:'— platforms',reported.length?'At or ahead of expected pace':'Awaiting current-period data')}${metric('Platforms Behind',reported.filter(r=>r.status==='Behind').length,reported.length?'Schedule-based pace':'Awaiting current-period data')}</div></section>`;
          const focusPriority=priority.slice(0,3).map(p=>p.project).join(', ')||'No projects currently flagged';
          const focusWaiting=waiting.slice(0,3).map(p=>p.project).join(', ')||'No dependencies currently recorded';
          const weekly=`<section><h2>Weekly Focus</h2><div class="summary"><ul><li><strong>Priority attention:</strong> ${esc(focusPriority)}.</li><li><strong>Dependencies to move:</strong> ${esc(focusWaiting)}.</li><li><strong>Publishing pace:</strong> ${reported.length?`${counts.Behind} behind, ${counts.Attention} need attention, and ${counts['On Track']} on track.`:`Awaiting current-period publishing data.`}</li></ul></div></section>`;
          const liveRows=live.length?[...live].sort((a,b)=>urgency[a.status]-urgency[b.status]||a.client.localeCompare(b.client)||a.platform.localeCompare(b.platform)).map(r=>{const pct=r.published==null||r.target==null?'—':`${Math.round(r.published/r.target*100)}%`,width=r.published==null||r.target==null?0:Math.min(100,r.published/r.target*100);return `<tr><td>${esc(r.client)}</td><td>${esc(r.platform)}</td><td>${pct}<div class="progress-track"><div class="progress-fill ${statusClass(r.status)}" style="width:${width}%"></div></div></td><td>${r.published==null?'—':esc(r.published)} / ${esc(r.target??'—')}</td><td>${esc(ownerName(r.owner))}</td><td>${tag(r.status)}</td></tr>`}).join(''):'<tr><td colspan="6" class="inactive">Awaiting current-period setup.</td></tr>';
          const publishing=`<section id="publishing-progress"><h2>Publishing Progress</h2><p class="section-note">Current weekly and monthly delivery only. Historical cumulative reporting appears below.</p><div class="metric-card"><div class="metric-label">Overall Posting Progress</div><div class="metric-value">${overall==null?'—':`${Math.round(overall*100)}%`}</div><div class="metric-detail">${allReported?`${totalPublished} / ${totalTarget} Posts`:`— / ${totalTarget} Posts · ${live.length-reported.length} awaiting data`}</div><div class="overall-progress"><div class="progress-fill track" style="width:${overall==null?0:Math.min(100,overall*100)}%"></div></div></div><h3 style="font-size:13px;margin:18px 0 8px;">Status Summary</h3><div class="kpi-grid">${metric('On Track',reported.length?`${counts['On Track']} platforms`:'— platforms','Meeting expected pace')}${metric('Attention',reported.length?`${counts.Attention} platforms`:'— platforms','Below expected pace')}${metric('Behind',reported.length?`${counts.Behind} platforms`:'— platforms','Needs follow-up')}${metric('Ahead',reported.length?`${counts.Ahead} platforms`:'— platforms','Ahead of expected pace')}</div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Platform</th><th>Progress</th><th>Published / Target</th><th>Owner</th><th>Status</th></tr></thead><tbody>${liveRows}</tbody></table></div></section>`;
          const priorityRows=priority.length?priority.map(p=>`<tr><td>${esc(p.project)}</td><td>${tag(p.status)}</td><td>${esc(p.phase||'—')}</td><td>${esc(p.focus||'—')}</td><td>${esc(p.next||'—')}</td><td>${esc(ownerName(p.owner))}</td></tr>`).join(''):'<tr><td colspan="6" class="inactive">No priority projects currently flagged.</td></tr>';
          const priorities=`<section><h2>Priority Projects</h2><p class="section-note">Strategic, launch, dependency, or attention-required projects only.</p><div class="table-wrap"><table><thead><tr><th>Project</th><th>Status</th><th>Phase</th><th>Current Focus</th><th>Next Step</th><th>Owner</th></tr></thead><tbody>${priorityRows}</tbody></table></div></section>`;
          const pipelineProjects=activeProjects.map(p=>`<tr><td>${esc(p.project)}</td><td>${esc(p.phase||'—')}</td><td>${tag(p.status)}</td><td>${esc(ownerName(p.owner))}</td><td>${esc(p.next||'—')}</td></tr>`).join('');
          const pipelineStreams=streamRows.filter(s=>!['Completed','Waiting'].includes(s.status)).map(s=>`<tr><td>${esc(s.client)}</td><td>${esc(s.workstream)}</td><td>${tag(s.status)}</td><td>${esc(ownerName(s.owner))}</td><td>${esc(s.due||'No deadline recorded')}</td></tr>`).join('');
          const pipeline=`<section><h2>Project Pipeline</h2><p class="section-note">Live projects and active workstreams.</p><div class="table-wrap"><table><thead><tr><th>Client</th><th>Current Phase / Workstream</th><th>Status</th><th>Owner</th><th>Next Milestone / Deadline</th></tr></thead><tbody>${pipelineProjects}${pipelineStreams||''}</tbody></table></div></section>`;
          const waitRows=waiting.length?waiting.map(p=>`<tr><td>${esc(p.project)}</td><td>${esc(p.waiting||'Not recorded')}</td><td>Not recorded</td><td>${esc(p.next||'Not recorded')}</td><td>${esc(p.phase==='Waiting Brief'?'Launch blocked':p.status==='Waiting'?'Delivery paused':'Needs attention')}</td></tr>`).join(''):'<tr><td colspan="5" class="inactive">No waiting or blocked items recorded.</td></tr>';
          const waits=`<section><h2>Waiting / Blocked</h2><div class="table-wrap"><table><thead><tr><th>Project</th><th>Waiting For</th><th>Since</th><th>Next Follow-up</th><th>Impact</th></tr></thead><tbody>${waitRows}</tbody></table></div></section>`;
          const clientRows=activeProjects.map(p=>`<tr><td>${esc(p.project)}</td><td>${tag(p.status)}</td><td>${esc(p.phase||'—')}</td><td>${tag(clientPosting(p.project))}</td><td>${esc(ownerName(p.owner))}</td><td>${esc(p.next||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="inactive">No active clients recorded.</td></tr>';
          const clients=`<section><h2>Active Client Overview</h2><div class="table-wrap"><table><thead><tr><th>Client</th><th>Overall Status</th><th>Current Phase</th><th>Posting Status</th><th>Owner</th><th>Next Step</th></tr></thead><tbody>${clientRows}</tbody></table></div></section>`;
          const activeStreams=streamRows.filter(s=>!['Completed','Waiting'].includes(s.status));
          const ownership=owner=>{const groups={};activeStreams.filter(s=>s.owner===owner).forEach(s=>(groups[s.client]??=[]).push(s.workstream));return Object.entries(groups).map(([client,tasks])=>`<li><strong>${esc(client)}:</strong> ${esc(tasks.join(', '))}</li>`).join('')||'<li class="inactive">No active workstreams recorded.</li>'};
          const execution=`<section><h2>Delegated to Intern</h2><p class="section-note">All active responsibilities currently owned by the intern.</p><div class="ownership-card"><ul>${ownership('Intern')}</ul></div></section>`;
          const weekEnd=new Date(Date.UTC(year,month-1,day-Math.min(weekday,7)+7)).toISOString().slice(0,10);
          const completed=streamRows.filter(s=>s.status==='Completed'&&s.due&&s.due>=monday&&s.due<=weekEnd);
          const completedHtml=completed.length?`<div class="table-wrap"><table><thead><tr><th>Client</th><th>Workstream</th><th>Owner</th></tr></thead><tbody>${completed.map(s=>`<tr><td>${esc(s.client)}</td><td>${esc(s.workstream)}</td><td>${esc(ownerName(s.owner))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="inactive">No meaningful completed milestones recorded this week.</p>';
          const completedSection=`<section><h2>Completed This Week</h2>${completedHtml}</section>`;
          const riskProjects=projectRows.filter(p=>p.attention||p.status==='Priority'||p.priority==='High');
          const riskRows=[...riskProjects.map(p=>`<tr><td>${esc(p.project)}</td><td>${esc(p.waiting||p.focus||'Attention flag recorded')}</td><td>${esc(p.next||'No next step recorded')}</td><td>${esc(ownerName(p.owner))}</td></tr>`),...reported.filter(r=>['Behind','Attention'].includes(r.status)).map(r=>`<tr><td>${esc(r.client)} — ${esc(r.platform)}</td><td>Publishing ${esc(r.status.toLowerCase())} against expected pace</td><td>Review current-period delivery</td><td>${esc(ownerName(r.owner))}</td></tr>`)].join('')||'<tr><td colspan="4" class="inactive">No risks or attention items recorded.</td></tr>';
          const risks=`<section><h2>Risks / Attention Needed</h2><div class="table-wrap"><table><thead><tr><th>Project / Platform</th><th>Risk or Attention Item</th><th>Next Action</th><th>Owner</th></tr></thead><tbody>${riskRows}</tbody></table></div></section>`;
          const historyRows=historical.map(row=>{const p=row.properties||{},published=num(p.Published),target=num(p.Target),range=text(p['Target Range']),completion=published==null||target==null?'—':`${Math.round(published/target*100)}%`;return `<tr><td>${esc(alias(title(p.Client)))}</td><td>${esc(select(p.Platform))}</td><td>${esc(date(p['Tracking Start'])||'—')}</td><td>${esc(date(p['Tracking End'])||'—')}</td><td>${esc(published??'—')}</td><td>${esc(target==null?(range||'—'):target)}</td><td>${completion}</td></tr>`}).join('')||'<tr><td colspan="7" class="inactive">No historical publishing records available.</td></tr>';
          const history=`<section id="historical-publishing-performance"><h2>Historical Publishing Performance</h2><p class="section-note">Cumulative contract and YTD reference data. It does not indicate current-period pace.</p><div class="table-wrap"><table><thead><tr><th>Client</th><th>Platform</th><th>Tracking Start</th><th>Tracking End</th><th>Published</th><th>Target</th><th>Completion</th></tr></thead><tbody>${historyRows}</tbody></table></div></section>`;
          const dashboard=executive+pipeline+publishing+execution+waits+risks+completedSection+history;
          let html=fs.readFileSync('_site/index.html','utf8');
          html=html.replace(/<div id="manager-dashboard">[\s\S]*?<\/div>/,`<div id="manager-dashboard">${dashboard}</div>`);
          html=html.replace(/<div data-legacy class="summary">[\s\S]*?<\/div>/,'').replace(/<section data-legacy[\s\S]*?<\/section>/g,'');
          fs.writeFileSync('_site/index.html',html);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
